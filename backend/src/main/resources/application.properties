# Spring Boot Application Properties
server.port=8080
spring.application.name=clickhouse-flatfile-ingestion-tool

# Logging
logging.level.org.springframework=INFO
logging.level.com.cascade.assignment=DEBUG

# Batch processing configurations
app.batch.size=1000
app.streaming.threshold=10000

# HikariCP for ClickHouse connection pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# (Optional) Add ClickHouse or file-specific configs here
