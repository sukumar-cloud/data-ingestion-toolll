services:
  - type: web
    name: clickhouse-ingestion-tool
    env: docker
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: REACT_APP_API_URL
        value: https://clickhouse-ingestion-backend.onrender.com
    plan: free
    numInstances: 1
    healthCheckPath: /
    autoDeploy: true

  - type: web
    name: clickhouse-ingestion-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    plan: free
    numInstances: 1
    healthCheckPath: /actuator/health
    autoDeploy: true
